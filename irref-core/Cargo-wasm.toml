[package]
name = "irref-core"
version = "0.1.0"
edition = "2021"
description = "IRREF - Irrefutable Record Exchange Framework Core Library (WASM)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]
name = "irref_core"

[dependencies]
# Canonical CBOR encoding/decoding
ciborium = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"

# WASM support
wasm-bindgen = "0.2"

# Utilities
uuid = { version = "1.0", features = ["v4", "rng-getrandom"] }
chrono = "0.4"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rand = "0.8"
wasm-bindgen-test = "0.3"

